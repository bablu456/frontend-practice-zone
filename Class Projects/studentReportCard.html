<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Report Card</title>
    <style>
        center{
            background-color: antiquewhite;
            border-radius: 8px;
            height: 80px;
            margin-bottom: 18px;
        }
        th{
            background: #eef;
        }
        td,th{
            border: 1px solid #ddd;
        }
        table{
            width: 100%;
            border-collapse: collapse;
        }
    </style>

</head>
<body>
        <center>    <h2>Report Card</h2>
    <p>Name: Bablu kumar | Roll: 23</p></center>
    <table border="1" cellpadding="8" cellspacing="0"> 
        <tr><th>Subject</th><th>Marks</th><th>Grade</th></tr>  
            <tr><td>Maths</td><td>88</td><td>A</td></tr>
            <tr><td>Physics</td><td>82</td><td>A</td></tr>
            <tr><td>Chemistry</td><td>76</td><td>B+</td></tr>
        </td>
    </table>
    
</body>
</html>
