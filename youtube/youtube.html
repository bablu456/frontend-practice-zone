<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="youtube.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YOUTUBE</title>

  </head>
  <body>
    
    <input class="search-bar" type="text" placeholder="Serach videos" />

        <div>
            <div class="logo-1">

            </div>

             <div class="video-info-grid" >

                <p class="video-title">
                  Talking tech and AI with Google CEO sundar pichai!<br />
                </p>

                <p class="video-stats">3.4M views &#183; 6 month ago</p>

        </div> 
        </div>    
    </div>
    <!-- second youtube design -->
    <div class="video-preview">
        <div>
            <img class="first" src="thumbnail/second_thumbnail.webp" alt="sundar-pichai"/>
        </div>
        <!-- nesting logo-2 -->
        <div class="logo-1">
            <img class="profile-1" src="thumbnail/logo-2.jpeg" alt="logo-2">
        </div>
        <!-- nesting video statss -->
         <div class="video-info">
             <p class="video-title">Try not to laugh Challange #9 <br /></p>

</html>
