<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>

  <!-- ===== Sidebar ===== -->
  <aside class="sidebar">
    <h2 class="logo">Edu<span>Hub</span></h2>
    <ul>
      <li class="active"><i class="fas fa-home"></i> Dashboard</li>
      <li><i class="fas fa-book"></i> Courses</li>
      <li><i class="fas fa-user-graduate"></i> Profile</li>
      <li><i class="fas fa-cog"></i> Settings</li>
    </ul>
  </aside>

  <!-- ===== Main Section ===== -->
  <main class="main-content">
    <header class="topbar">
      <h1>Welcome, Bablu 👋</h1>
      <div class="profile">
        <img src="https://i.imgur.com/6VBx3io.png" alt="Profile">
      </div>
    </header>

    <!-- Cards -->
    <section class="cards">
      <div class="card">
        <h3>📚 Courses</h3>
        <p>5 Active Courses</p>
      </div>
      <div class="card">
        <h3>📈 Progress</h3>
        <p>80% Completed</p>
      </div>
      <div class="card">
        <h3>🎯 Goals</h3>
        <p>2 Goals Pending</p>
      </div>
    </section>

    <!-- Hidden Section Example -->
    <section class="hidden-section">
      <h2>Hidden Section</h2>
      <p>This section is hidden using <b>visibility: hidden;</b> (it takes space but invisible).</p>
    </section>
  </main>

</body>
</html>
