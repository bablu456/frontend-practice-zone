<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        a{
            color: rgb(0, 113, 133);
        }
        a:hover{
            color: yellow;
        }
        .price{
            color: rgb(0, 118, 0);
        }
        .Cart{
            background-color: rgb(255, 216, 20);
            color: black;
            border-radius: 20px;
            border-style: solid;
            border: none;
            width: 110px;
            height: 30px;
            cursor: pointer;
            font-size: 15px;

        }
        .Cart:active{
        opacity: 0.5;
        }
        .buy{
            background-color: rgb(255, 164, 28);
            color: black;
            border: none;
            border-radius: 20px;
            height: 30px;
            width: 110px;
            cursor: pointer;
            margin-left: 8px;
        
            font-size: 15px;
        }
        .buy:active{
            opacity: 0.6;
        }
        .nike{
            font-weight: bold;
            font-size: 20px;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excersize</title>
</head>
<body>
    <a href="www.amzon.com">Back to Amazon</a>
    <p class="nike">Nike Black Running Shoes</p>
    <p class="price">$39- in stock.</p>
    <p>Free delivery tomorrow.</p>
    <button class="Cart">Add to Cart</button>
    <button class="buy">Buy now</button>
</body>
</html>
