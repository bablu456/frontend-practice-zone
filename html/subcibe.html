<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        .subcribe-button{
            background-color: rgb(200, 00, 00);
            border: none;
            color: white;
            padding-top: 10px;
            padding-left: 20px;
            padding-bottom: 10px;
            padding-right: 20px;
            border-radius: 2px;
            cursor: pointer;
            vertical-align: top;
            
        }
        .subcribe-button:hover{
           opacity: 0.8;
        }
        .subcribe-button:active {
            opacity: 0.5;

        }
        .join-button{
            background-color: rgb(245, 250, 250);
            color: rgb(41, 118, 211);
            border-style: solid;
            border-width: 1px;
            cursor: pointer;
            margin-left: 8px;
            border-radius: 2px;
            border-color: rgb(41, 118, 211);
            transition: background-color 0.15s,
            color 0.15s;
            vertical-align: top;
            padding-top: 9px;
            padding-left: 20px;
            padding-bottom: 9px;
            padding-right: 20px;
        }
        .join-button:hover{
            background-color: rgb(41, 118, 211);
            color: white;
        }
        .join-button:active{
            opacity: 0.8;
        }
        .tweet-button{
            background-color: rgb(2, 158, 253);
            border-radius: 18px;
            color: white;
            border: none;
            border-style: solid;
            font-weight: bold;
            margin-left: 7px;
            font-size: 15px;
            cursor: pointer;
            vertical-align: top;
            padding-top: 11px;
            padding-left: 20px;
            padding-bottom: 6px;
            padding-right: 20px;
            border-radius: 20px;
        }
        .tweet-button:hover{
            box-shadow: 5px 5px 10px rgb(0, 0, 0,0.15);

        }
       
       

    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subcribe Button</title>
</head>
<body>
    <button class="subcribe-button">SUBSCRIBE</button>
    <button class="join-button">JOIN</button>
    <button class="tweet-button">Tweet</button>
</body>
</html>
